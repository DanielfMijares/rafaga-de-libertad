<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ráfaga de Libertad - La Red</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d0d; color: #e0e0e0; overflow-x: hidden;
        }

        /* Pantalla de inicio para activar Audio y Video */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #start-btn {
            padding: 20px 40px; font-size: 1.5rem; font-family: 'Courier New', Courier, monospace;
            background: transparent; color: #ff0055; border: 2px solid #ff0055;
            cursor: pointer; text-transform: uppercase; letter-spacing: 5px;
            transition: 0.3s; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }
        #start-btn:hover { background: #ff0055; color: #000; }

        /* Video de fondo */
        .video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; overflow: hidden;
        }
        video {
            min-width: 100%; min-height: 100%;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            filter: grayscale(30%) brightness(40%) contrast(120%);
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: -1;
        }

        /* Contenido */
        .content {
            position: relative; z-index: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; min-height: 100vh;
            text-align: center; padding: 50px 20px;
        }

        h1 {
            font-size: 4rem; margin-bottom: 10px; text-transform: uppercase;
            letter-spacing: 8px; color: #d4af37; text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            animation: glitch 3s infinite;
        }

        p.slogan { font-size: 1.3rem; max-width: 800px; margin-bottom: 30px; font-style: italic; color: #ccc; }

        /* Sección Cómic y Texto Cifrado */
        .comic-container { width: 100%; max-width: 800px; margin-bottom: 10px; }
        .comic-container img { width: 100%; height: auto; border: 2px solid #ff0055; border-radius: 10px; box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); }
        .comic-text { color: #ff0055; margin-bottom: 50px; font-style: italic; font-size: 1.2rem; letter-spacing: 1px; }
        
        /* Título Underground para los Banners */
        .classified-title { font-size: 1.2rem; color: #d4af37; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 3px; border-bottom: 1px solid #d4af37; padding-bottom: 5px; }

        /* Banners de Compra (Imágenes) */
        .banners-container {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px;
            width: 100%; max-width: 1000px;
        }
        .banner-link {
            display: block; width: 100%; max-width: 400px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .banner-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .banner-link img {
            width: 100%; height: auto; border-radius: 10px; border: 2px solid #d4af37;
        }

        /* Redes Sociales */
        .social-links { display: flex; gap: 20px; margin-bottom: 50px; flex-wrap: wrap; justify-content: center;}
        .social-links a { 
            color: #fff; text-decoration: none; font-size: 1.3rem; 
            font-weight: bold; transition: 0.3s; padding: 15px 30px;
            border: 2px solid #ff0055; border-radius: 5px; background: rgba(255, 0, 85, 0.2);
            text-transform: uppercase; letter-spacing: 2px;
        }
        .social-links a:hover { background: #ff0055; box-shadow: 0 0 20px #ff0055; color: #000; }

        /* Imagen de la Comunidad y Manifiesto */
